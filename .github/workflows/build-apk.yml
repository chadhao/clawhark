name: Build ClawHark APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK 路径
        run: |
          mkdir -p $HOME/.android/sdk/cmdline-tools
          echo "ANDROID_HOME=$HOME/.android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.android/sdk" >> $GITHUB_ENV

      - name: 安装 Android cmdline-tools
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm -rf $ANDROID_HOME/cmdline-tools/latest
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest

      - name: 接受 SDK 许可
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: 安装必需的 SDK 组件
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: 修复 gradle.properties（移除 Windows 硬编码 JAVA_HOME）
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          echo "=== 修复后的 gradle.properties ==="
          cat gradle.properties

      - name: 修复 settings.gradle.kts（替换阿里云镜像为 Google 官方仓库）
        run: |
          sed -i 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' settings.gradle.kts
          sed -i 's|https://maven.aliyun.com/repository/public|https://repo.maven.apache.org/maven2|g' settings.gradle.kts
          sed -i 's|https://maven.aliyun.com/repository/gradle-plugin|https://plugins.gradle.org/m2|g' settings.gradle.kts
          echo "=== 修复后的 settings.gradle.kts ==="
          cat settings.gradle.kts

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 清理 .gradle 缓存
        run: rm -rf ~/.gradle/caches

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 验证 APK 生成
        run: |
          ls -la app/build/outputs/apk/debug/
          file app/build/outputs/apk/debug/app-debug.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: clawhark-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
